<text x="450.0" y="24" text-anchor="middle" class="t">Lasso peptide topology: an isopeptide ring with a threaded C-terminal tail</text>
<text x="150" y="64" text-anchor="middle" class="lbl">Linear peptide</text><circle cx="45" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><circle cx="71" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="54" y1="130" x2="62" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="97" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="80" y1="130" x2="88" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="123" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="106" y1="130" x2="114" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="149" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="132" y1="130" x2="140" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="175" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="158" y1="130" x2="166" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="201" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="184" y1="130" x2="192" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="227" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="210" y1="130" x2="218" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="253" cy="130" r="9" fill="#2b6cb0" opacity="0.9"/><line x1="236" y1="130" x2="244" y2="130" stroke="#2b6cb0" stroke-width="2.4"/><text x="150" y="172" text-anchor="middle" class="xs">flexible backbone</text><text x="150" y="188" text-anchor="middle" class="xs">proteases cleave anywhere</text><text x="450" y="64" text-anchor="middle" class="lbl">Cyclic peptide</text><circle cx="450" cy="150" r="44" fill="none" stroke="#2b6cb0" stroke-width="9" opacity="0.9"/><text x="450" y="154" text-anchor="middle" class="xs">head-to-tail</text><text x="450" y="216" text-anchor="middle" class="xs">rigid, but no threaded topology</text><text x="740" y="64" text-anchor="middle" class="lbl" fill="#dd6b20">Lasso peptide</text><path d="M 696 152 A 44 44 0 0 1 784 152" fill="none" stroke="#dd6b20" stroke-width="9" opacity="0.85"/><path d="M 734 168 C 706 148, 762 118, 738 106 C 728 98, 766 100, 798 106" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/><path d="M 734 168 C 706 148, 762 118, 738 106 C 728 98, 766 100, 798 106" fill="none" stroke="#dd6b20" stroke-width="7.5" stroke-linecap="round"/><path d="M 696 152 A 44 44 0 0 0 784 152" fill="none" stroke="#dd6b20" stroke-width="9" opacity="0.85"/><circle cx="710.1" cy="119.9" r="6.5" fill="#c53030" stroke="white" stroke-width="1.5"/><text x="698.1" y="122.9" text-anchor="end" class="xs" fill="#c53030">isopeptide bond</text><text x="740" y="216" text-anchor="middle" class="xs">tail threaded through the ring</text><text x="740" y="232" text-anchor="middle" class="xs">&#8594; proteases blocked, thermally locked</text><text x="450.0" y="268" text-anchor="middle" class="xs">The threaded [1]rotaxane fold is why generic structure predictors fail on this class.</text></svg>