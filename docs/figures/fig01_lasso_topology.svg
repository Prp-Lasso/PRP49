<text x="450.0" y="24" text-anchor="middle" class="t">Lasso peptide: the tail leaves the ring, turns back, and threads through it</text>
<text x="130" y="62" text-anchor="middle" class="lbl">Linear peptide</text><line x1="49.5" y1="200" x2="58.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><line x1="73.5" y1="200" x2="82.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><line x1="97.5" y1="200" x2="106.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><line x1="121.5" y1="200" x2="130.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><line x1="145.5" y1="200" x2="154.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><line x1="169.5" y1="200" x2="178.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><line x1="193.5" y1="200" x2="202.5" y2="200" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="42.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="66.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="90.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="114.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="138.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="162.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="186.0" cy="200" r="7.5" fill="#2b6cb0"/><circle cx="210.0" cy="200" r="7.5" fill="#2b6cb0"/><text x="130" y="245" text-anchor="middle" class="xs">flexible backbone</text><text x="130" y="261" text-anchor="middle" class="xs">proteases cleave anywhere</text><text x="340" y="62" text-anchor="middle" class="lbl">Cyclic peptide</text><line x1="340.0" y1="156.0" x2="365.9" y2="164.4" stroke="#2b6cb0" stroke-width="2.4"/><line x1="365.9" y1="164.4" x2="381.8" y2="186.4" stroke="#2b6cb0" stroke-width="2.4"/><line x1="381.8" y1="186.4" x2="381.8" y2="213.6" stroke="#2b6cb0" stroke-width="2.4"/><line x1="381.8" y1="213.6" x2="365.9" y2="235.6" stroke="#2b6cb0" stroke-width="2.4"/><line x1="365.9" y1="235.6" x2="340.0" y2="244.0" stroke="#2b6cb0" stroke-width="2.4"/><line x1="340.0" y1="244.0" x2="314.1" y2="235.6" stroke="#2b6cb0" stroke-width="2.4"/><line x1="314.1" y1="235.6" x2="298.2" y2="213.6" stroke="#2b6cb0" stroke-width="2.4"/><line x1="298.2" y1="213.6" x2="298.2" y2="186.4" stroke="#2b6cb0" stroke-width="2.4"/><line x1="298.2" y1="186.4" x2="314.1" y2="164.4" stroke="#2b6cb0" stroke-width="2.4"/><line x1="314.1" y1="164.4" x2="340.0" y2="156.0" stroke="#2b6cb0" stroke-width="2.4"/><circle cx="340.0" cy="156.0" r="7.5" fill="#2b6cb0"/><circle cx="365.9" cy="164.4" r="7.5" fill="#2b6cb0"/><circle cx="381.8" cy="186.4" r="7.5" fill="#2b6cb0"/><circle cx="381.8" cy="213.6" r="7.5" fill="#2b6cb0"/><circle cx="365.9" cy="235.6" r="7.5" fill="#2b6cb0"/><circle cx="340.0" cy="244.0" r="7.5" fill="#2b6cb0"/><circle cx="314.1" cy="235.6" r="7.5" fill="#2b6cb0"/><circle cx="298.2" cy="213.6" r="7.5" fill="#2b6cb0"/><circle cx="298.2" cy="186.4" r="7.5" fill="#2b6cb0"/><circle cx="314.1" cy="164.4" r="7.5" fill="#2b6cb0"/><text x="340" y="278" text-anchor="middle" class="xs">closed head-to-tail</text><text x="340" y="294" text-anchor="middle" class="xs">rigid, but nothing threads it</text><text x="660" y="62" text-anchor="middle" class="lbl" fill="#dd6b20">Lasso peptide</text><line x1="556" y1="132" x2="578" y2="108" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="578" y1="108" x2="612" y2="100" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="612" y1="100" x2="646" y2="106" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="646" y1="106" x2="668" y2="128" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="668" y1="128" x2="676" y2="160" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="676" y1="160" x2="668" y2="190" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="668" y1="190" x2="625" y2="202" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="625" y1="202" x2="600" y2="210" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="210" x2="575" y2="218" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="575" y1="218" x2="548" y2="246" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="548" y1="246" x2="540" y2="278" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="567.5" y1="167.5" x2="556" y2="132" stroke="#dd6b20" stroke-width="3" stroke-linecap="round"/><line x1="600.0" y1="154.0" x2="632.5" y2="167.5" stroke="#dd6b20" stroke-width="3"/><line x1="632.5" y1="167.5" x2="646.0" y2="200.0" stroke="#dd6b20" stroke-width="3"/><line x1="646.0" y1="200.0" x2="632.5" y2="232.5" stroke="#dd6b20" stroke-width="3"/><line x1="632.5" y1="232.5" x2="600.0" y2="246.0" stroke="#dd6b20" stroke-width="3"/><line x1="600.0" y1="246.0" x2="567.5" y2="232.5" stroke="#dd6b20" stroke-width="3"/><line x1="567.5" y1="232.5" x2="554.0" y2="200.0" stroke="#dd6b20" stroke-width="3"/><line x1="554.0" y1="200.0" x2="567.5" y2="167.5" stroke="#dd6b20" stroke-width="3"/><line x1="567.5" y1="167.5" x2="600.0" y2="154.0" stroke="#dd6b20" stroke-width="3"/><circle cx="556" cy="132" r="7.5" fill="#dd6b20"/><text x="556" y="135" text-anchor="middle" class="num">9</text><circle cx="578" cy="108" r="7.5" fill="#dd6b20"/><text x="578" y="111" text-anchor="middle" class="num">10</text><circle cx="612" cy="100" r="7.5" fill="#dd6b20"/><text x="612" y="103" text-anchor="middle" class="num">11</text><circle cx="646" cy="106" r="7.5" fill="#dd6b20"/><text x="646" y="109" text-anchor="middle" class="num">12</text><circle cx="668" cy="128" r="7.5" fill="#dd6b20"/><text x="668" y="131" text-anchor="middle" class="num">13</text><circle cx="676" cy="160" r="7.5" fill="#dd6b20"/><text x="676" y="163" text-anchor="middle" class="num">14</text><circle cx="668" cy="190" r="7.5" fill="#dd6b20"/><text x="668" y="193" text-anchor="middle" class="num">15</text><circle cx="625" cy="202" r="7.5" fill="#dd6b20"/><text x="625" y="205" text-anchor="middle" class="num">16</text><circle cx="600" cy="210" r="7.5" fill="#dd6b20"/><text x="600" y="213" text-anchor="middle" class="num">17</text><circle cx="575" cy="218" r="7.5" fill="#dd6b20"/><text x="575" y="221" text-anchor="middle" class="num">18</text><circle cx="548" cy="246" r="7.5" fill="#dd6b20"/><text x="548" y="249" text-anchor="middle" class="num">19</text><circle cx="540" cy="278" r="7.5" fill="#dd6b20"/><text x="540" y="281" text-anchor="middle" class="num">20</text><circle cx="600.0" cy="154.0" r="7.5" fill="#dd6b20"/><text x="600.0" y="157.0" text-anchor="middle" class="num">1</text><circle cx="632.5" cy="167.5" r="7.5" fill="#dd6b20"/><text x="632.5" y="170.5" text-anchor="middle" class="num">2</text><circle cx="646.0" cy="200.0" r="7.5" fill="#dd6b20"/><text x="646.0" y="203.0" text-anchor="middle" class="num">3</text><circle cx="632.5" cy="232.5" r="7.5" fill="#dd6b20"/><text x="632.5" y="235.5" text-anchor="middle" class="num">4</text><circle cx="600.0" cy="246.0" r="7.5" fill="#dd6b20"/><text x="600.0" y="249.0" text-anchor="middle" class="num">5</text><circle cx="567.5" cy="232.5" r="7.5" fill="#dd6b20"/><text x="567.5" y="235.5" text-anchor="middle" class="num">6</text><circle cx="554.0" cy="200.0" r="7.5" fill="#dd6b20"/><text x="554.0" y="203.0" text-anchor="middle" class="num">7</text><circle cx="567.5" cy="167.5" r="7.5" fill="#dd6b20"/><text x="567.5" y="170.5" text-anchor="middle" class="num">8</text><path d="M 600.0 154.0 A 28.5 28.52 0 0 1 567.5 167.5" fill="none" stroke="#c53030" stroke-width="2.4" stroke-dasharray="5 3"/><text x="504" y="154" text-anchor="end" class="xs" fill="#c53030">isopeptide bond</text><path d="M 508 160 L 582 160" stroke="#c53030" stroke-width="1" stroke-dasharray="2 2"/><text x="716" y="118" text-anchor="start" class="xs">1. the chain leaves the ring at bead 9</text><path d="M 712 114 L 594 112" fill="none" stroke="#718096" stroke-width="1.1" marker-end="url(#arw)"/><text x="716" y="150" text-anchor="start" class="xs">2. it turns back and comes down</text><path d="M 712 146 L 680 128" fill="none" stroke="#718096" stroke-width="1.1" marker-end="url(#arw)"/><text x="716" y="182" text-anchor="start" class="xs">3. and threads through the ring</text><text x="716" y="196" text-anchor="start" class="xs">   (beads 16-18 sit in the hole;</text><text x="716" y="210" text-anchor="start" class="xs">   the ring hides the tail where</text><text x="716" y="224" text-anchor="start" class="xs">   they cross)</text><path d="M 712 190 L 682 190" fill="none" stroke="#718096" stroke-width="1.1" marker-end="url(#arw)"/><text x="450.0" y="316" text-anchor="middle" class="xs">One chain, one colour: beads 1-8 close the macrolactam ring through an isopeptide bond between the N-terminus</text><text x="450.0" y="330" text-anchor="middle" class="xs">and an Asp/Glu side chain. Beads 9-20 are that same chain continuing: pulled out of the ring, turned back,</text><text x="450.0" y="344" text-anchor="middle" class="xs">and threaded through its own loop - the trapped topology that makes lasso peptides protease-resistant.</text></svg>