<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300">
<rect width="940" height="300" fill="white"/>
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #1a202c; }
  .t  { font-size: 15px; font-weight: bold; }
  .s  { font-size: 11.5px; }
  .xs { font-size: 10px; fill: #4a5568; }
  .lbl { font-size: 12px; font-weight: bold; }
</style>
<text x="470.0" y="26" text-anchor="middle" class="t">Lasso peptide biosynthesis: cyclisation then threading</text>
<rect x="30" y="80" width="190" height="110" rx="12" fill="#718096" opacity="0.10" stroke="#718096" stroke-width="2"/><text x="125.0" y="118" text-anchor="middle" class="lbl" fill="#718096">Precursor peptide</text><text x="125.0" y="142" text-anchor="middle" class="xs">leader + core</text><path d="M 226 135 L 242 135" stroke="#718096" stroke-width="2.4" marker-end="url(#ah)"/><rect x="250" y="80" width="190" height="110" rx="12" fill="#2b6cb0" opacity="0.10" stroke="#2b6cb0" stroke-width="2"/><text x="345.0" y="118" text-anchor="middle" class="lbl" fill="#2b6cb0">Macrolactam ring</text><text x="345.0" y="142" text-anchor="middle" class="xs">lasso cyclase</text><text x="345.0" y="158" text-anchor="middle" class="xs">closes N-term to Asp/Glu</text><path d="M 446 135 L 462 135" stroke="#718096" stroke-width="2.4" marker-end="url(#ah)"/><rect x="470" y="80" width="190" height="110" rx="12" fill="#dd6b20" opacity="0.10" stroke="#dd6b20" stroke-width="2"/><text x="565.0" y="118" text-anchor="middle" class="lbl" fill="#dd6b20">Threading</text><text x="565.0" y="142" text-anchor="middle" class="xs">C-terminal tail</text><text x="565.0" y="158" text-anchor="middle" class="xs">passes through the ring</text><path d="M 666 135 L 682 135" stroke="#718096" stroke-width="2.4" marker-end="url(#ah)"/><rect x="690" y="80" width="190" height="110" rx="12" fill="#c53030" opacity="0.10" stroke="#c53030" stroke-width="2"/><text x="785.0" y="118" text-anchor="middle" class="lbl" fill="#c53030">Mature lasso peptide</text><text x="785.0" y="142" text-anchor="middle" class="xs">topology locked</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#718096"/></marker></defs><text x="470.0" y="232" text-anchor="middle" class="xs">Only ~50 distinct lasso peptides have been structurally characterised in 30 years,</text><text x="470.0" y="250" text-anchor="middle" class="xs">while genome mining proposes thousands of sequences.</text></svg>