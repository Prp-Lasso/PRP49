<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330">
<rect width="880" height="330" fill="white"/>
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #1a202c; }
  .t  { font-size: 15px; font-weight: bold; }
  .s  { font-size: 11.5px; }
  .xs { font-size: 10px; fill: #4a5568; }
  .lbl { font-size: 12px; font-weight: bold; }
</style>
<text x="440.0" y="26" text-anchor="middle" class="t">Why generic structure predictors fail, and what LassoPred adds</text>
<line x1="440.0" y1="52" x2="440.0" y2="300" stroke="#e2e8f0" stroke-width="1.5"/><text x="220.0" y="76" text-anchor="middle" class="lbl" fill="#c53030">Generic tools</text><rect x="60" y="112" width="270" height="36" rx="8" fill="#c53030" opacity="0.08" stroke="#c53030" stroke-width="1.6"/><text x="82" y="136" class="s">AlphaFold2</text><text x="316" y="136" text-anchor="end" class="s" fill="#c53030">&#10007; knot + isopeptide</text><rect x="60" y="158" width="270" height="36" rx="8" fill="#c53030" opacity="0.08" stroke="#c53030" stroke-width="1.6"/><text x="82" y="182" class="s">AlphaFold3</text><text x="316" y="182" text-anchor="end" class="s" fill="#c53030">&#10007; knot + isopeptide</text><rect x="60" y="204" width="270" height="36" rx="8" fill="#c53030" opacity="0.08" stroke="#c53030" stroke-width="1.6"/><text x="82" y="228" class="s">ESMFold</text><text x="316" y="228" text-anchor="end" class="s" fill="#c53030">&#10007; knot + isopeptide</text><text x="220.0" y="268" text-anchor="middle" class="xs">irregular lariat-knot fold</text><text x="220.0" y="286" text-anchor="middle" class="xs">non-standard isopeptide bond</text><text x="660.0" y="76" text-anchor="middle" class="lbl" fill="#2b6cb0">LassoPred (Zhao / Vanderbilt / Princeton)</text><rect x="500" y="100" width="330" height="76" rx="10" fill="#2b6cb0" opacity="0.08" stroke="#2b6cb0" stroke-width="1.8"/><text x="520" y="126" class="s">1. classifier &#8594; ring / loop / tail</text><text x="520" y="150" class="s">2. constructor &#8594; assemble 3D model</text><text x="520" y="172" class="xs">(homology modelling + mutation + minimisation)</text><rect x="500" y="192" width="330" height="52" rx="10" fill="#dd6b20" opacity="0.12" stroke="#dd6b20" stroke-width="1.8"/><text x="520" y="216" class="lbl" fill="#dd6b20">4,749 predicted structures</text><text x="520" y="234" class="xs">vs &lt;50 experimentally solved in 30 years</text><text x="660.0" y="268" text-anchor="middle" class="xs">near-experimental accuracy, minutes per sequence</text></svg>