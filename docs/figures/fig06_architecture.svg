<defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#718096"/></marker></defs>
<text x="450.0" y="26" text-anchor="middle" class="t">Dual-encoder bilinear-attention architecture</text>
<rect x="40" y="66" width="200" height="52" rx="10" fill="#2b6cb0" opacity="0.10" stroke="#2b6cb0" stroke-width="1.8"/><text x="140" y="88" text-anchor="middle" class="lbl" fill="#2b6cb0">Target sequence</text><text x="140" y="106" text-anchor="middle" class="xs">up to 1024 aa</text><rect x="40" y="226" width="200" height="52" rx="10" fill="#dd6b20" opacity="0.10" stroke="#dd6b20" stroke-width="1.8"/><text x="140" y="248" text-anchor="middle" class="lbl" fill="#dd6b20">Lasso peptide</text><text x="140" y="266" text-anchor="middle" class="xs">15-40 aa, threaded topology</text><rect x="300" y="66" width="190" height="52" rx="10" fill="#2b6cb0" opacity="0.88"/><text x="395" y="90" text-anchor="middle" class="s" fill="white" font-weight="bold">ESM-2 (35M)</text><text x="395" y="106" text-anchor="middle" class="xs" fill="white">protein encoder</text><rect x="300" y="226" width="190" height="52" rx="10" fill="#dd6b20" opacity="0.88"/><text x="395" y="250" text-anchor="middle" class="s" fill="white" font-weight="bold">LassoESM (650M)</text><text x="395" y="266" text-anchor="middle" class="xs" fill="white">lasso-specific embedder</text><rect x="560" y="130" width="210" height="80" rx="12" fill="#2f855a" opacity="0.12" stroke="#2f855a" stroke-width="2"/><text x="665" y="158" text-anchor="middle" class="lbl" fill="#2f855a">Bilinear attention</text><text x="665" y="177" text-anchor="middle" class="xs">h=256, heads=3, k=2</text><text x="665" y="195" text-anchor="middle" class="xs">(BAN, low-rank factorised)</text><rect x="555" y="272" width="220" height="50" rx="10" fill="#2b6cb0" opacity="0.12" stroke="#2b6cb0" stroke-width="1.8"/><text x="665" y="293" text-anchor="middle" class="s" fill="#2b6cb0">Binding classifier</text><text x="665" y="310" text-anchor="middle" class="xs">BCE + alignment + ranking</text><rect x="555" y="336" width="220" height="50" rx="10" fill="#c53030" opacity="0.12" stroke="#c53030" stroke-width="1.8"/><text x="665" y="357" text-anchor="middle" class="s" fill="#c53030">Affinity regressor</text><text x="665" y="374" text-anchor="middle" class="xs">constrained output (tanh bound)</text><path d="M 240 92 L 300 92" stroke="#718096" stroke-width="2.2" marker-end="url(#ah3)"/><path d="M 240 252 L 300 252" stroke="#718096" stroke-width="2.2" marker-end="url(#ah3)"/><path d="M 490 92 C 530 92, 530 150, 560 158" fill="none" stroke="#718096" stroke-width="2.2" marker-end="url(#ah3)"/><path d="M 490 252 C 530 252, 530 190, 560 182" fill="none" stroke="#718096" stroke-width="2.2" marker-end="url(#ah3)"/><path d="M 630 210 C 610 240, 600 255, 600 272" fill="none" stroke="#718096" stroke-width="2.2" marker-end="url(#ah3)"/><path d="M 700 210 C 720 240, 730 300, 730 336" fill="none" stroke="#718096" stroke-width="2.2" marker-end="url(#ah3)"/></svg>