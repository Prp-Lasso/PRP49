<text x="450.0" y="26" text-anchor="middle" class="t">Project pipeline: from structure prediction to drug-potential mining</text>
<rect x="70" y="62" width="760" height="46" rx="10" fill="#718096" opacity="0.09" stroke="#718096" stroke-width="1.8"/><circle cx="100" cy="85" r="15" fill="#718096" opacity="0.85"/><text x="100" y="90" text-anchor="middle" class="s" fill="white" font-weight="bold">1</text><text x="128" y="83" class="lbl" fill="#718096">LassoPred output</text><text x="128" y="99" class="xs">4,749 predicted lasso peptide structures + topology annotations</text><path d="M 450 109 L 450 120" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="118" width="760" height="46" rx="10" fill="#2b6cb0" opacity="0.09" stroke="#2b6cb0" stroke-width="1.8"/><circle cx="100" cy="141" r="15" fill="#2b6cb0" opacity="0.85"/><text x="100" y="146" text-anchor="middle" class="s" fill="white" font-weight="bold">2</text><text x="128" y="139" class="lbl" fill="#2b6cb0">Preliminary docking</text><text x="128" y="155" class="xs">AutoDock Vina: lasso peptide x target feasibility, box handling for macrocycles</text><path d="M 450 165 L 450 176" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="174" width="760" height="46" rx="10" fill="#2b6cb0" opacity="0.09" stroke="#2b6cb0" stroke-width="1.8"/><circle cx="100" cy="197" r="15" fill="#2b6cb0" opacity="0.85"/><text x="100" y="202" text-anchor="middle" class="s" fill="white" font-weight="bold">3</text><text x="128" y="195" class="lbl" fill="#2b6cb0">Lasso vs linear classifier</text><text x="128" y="211" class="xs">sequence-level filter: is this really a lasso topology?</text><path d="M 450 221 L 450 232" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="230" width="760" height="46" rx="10" fill="#dd6b20" opacity="0.09" stroke="#dd6b20" stroke-width="1.8"/><circle cx="100" cy="253" r="15" fill="#dd6b20" opacity="0.85"/><text x="100" y="258" text-anchor="middle" class="s" fill="white" font-weight="bold">4</text><text x="128" y="251" class="lbl" fill="#dd6b20">Domain-specific embedder</text><text x="128" y="267" class="xs">LassoESM (650M) for peptides + ESM-2 for targets</text><path d="M 450 277 L 450 288" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="286" width="760" height="46" rx="10" fill="#dd6b20" opacity="0.09" stroke="#dd6b20" stroke-width="1.8"/><circle cx="100" cy="309" r="15" fill="#dd6b20" opacity="0.85"/><text x="100" y="314" text-anchor="middle" class="s" fill="white" font-weight="bold">5</text><text x="128" y="307" class="lbl" fill="#dd6b20">Bilinear attention model</text><text x="128" y="323" class="xs">BAN fusion &#8594; binding classifier + affinity regressor</text><path d="M 450 333 L 450 344" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="342" width="760" height="46" rx="10" fill="#c53030" opacity="0.09" stroke="#c53030" stroke-width="1.8"/><circle cx="100" cy="365" r="15" fill="#c53030" opacity="0.85"/><text x="100" y="370" text-anchor="middle" class="s" fill="white" font-weight="bold">6</text><text x="128" y="363" class="lbl" fill="#c53030">Scarcity handling</text><text x="128" y="379" class="xs">family-homolog augmentation of positives; family-grouped CV</text><path d="M 450 389 L 450 400" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="398" width="760" height="46" rx="10" fill="#c53030" opacity="0.09" stroke="#c53030" stroke-width="1.8"/><circle cx="100" cy="421" r="15" fill="#c53030" opacity="0.85"/><text x="100" y="426" text-anchor="middle" class="s" fill="white" font-weight="bold">7</text><text x="128" y="419" class="lbl" fill="#c53030">Constrained regression</text><text x="128" y="435" class="xs">output-constraint variants to stop divergence</text><path d="M 450 445 L 450 456" stroke="#718096" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="70" y="454" width="760" height="46" rx="10" fill="#2f855a" opacity="0.09" stroke="#2f855a" stroke-width="1.8"/><circle cx="100" cy="477" r="15" fill="#2f855a" opacity="0.85"/><text x="100" y="482" text-anchor="middle" class="s" fill="white" font-weight="bold">8</text><text x="128" y="475" class="lbl" fill="#2f855a">Screening + release</text><text x="128" y="491" class="xs">13 peptides x 50 targets &#8594; 10 candidates; open-sourced</text><defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#718096"/></marker></defs></svg>