# A+C: affinity classification with target-wise z-scored, binned labels
model:
  esm_model: ../esm2_35M_hf
  lassoesm_model: ../LassoESM_hf
  h_dim: 256
  n_heads: 3
  k: 2
  dropout: 0.3
  ban_dropout: 0.3
  freeze_esm: false
  lassoesm_unfreeze: 1
  dual_head: false
  use_topo: false

data:
  pairs_csv: ../mvp_cpu/affinity_cls_pairs.csv
  align_labels_json: null
  topo_csv: null
  max_len: 1024
  neg_pos_ratio: null
  group_col: prot_id          # generalise to unseen targets

train:
  batch_size: 16
  epochs: 40
  lr: 0.0002
  weight_decay: 0.0001
  patience: 8
  seed: 42
  num_seeds: 1
  align_loss_weight: 0.0
  rank_loss_weight: 0.3       # ranking term helps affinity-style ordering
  label_type: binary
  init_ckpt: null
  pu_weight: null

eval:
  cv_folds: 5
  cv_mode: grouped
  ablation_csv: null

scan:
  peptides_csv: ../mvp_cpu/scan_peptides_ext.csv
  targets_fasta: ../mvp_cpu/scan_targets.fasta
  output: ../results/scan_matrix.csv

paths:
  output_dir: ./runs_reg_cls
  checkpoint_dir: ./runs_reg_cls/checkpoints
