# warmup smoke: 300 Bernett pairs, dual 8M frozen encoders, 2 epochs (CPU ok)
model:
  esm_model: facebook/esm2_t6_8M_UR50D
  lassoesm_model: facebook/esm2_t6_8M_UR50D
  h_dim: 128
  n_heads: 2
  k: 2
  dropout: 0.3
  ban_dropout: 0.3
  freeze_esm: true
  lassoesm_unfreeze: 0
  dual_head: false

data:
  pairs_csv: ../mvp_cpu/bernett_smoke.csv
  align_labels_json: null
  max_len: 512
  neg_pos_ratio: null
  group_col: pdb

train:
  batch_size: 8
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  seed: 42
  num_seeds: 1
  align_loss_weight: 0.0
  align_loss_only_annotated: true
  pu_weight: null
  label_type: binary

eval:
  cv_folds: 3
  cv_mode: stratified
  ablation_csv: null

scan:
  peptides_csv: null
  targets_fasta: null
  output: ../results/scan_matrix.csv

paths:
  output_dir: ./runs_warmup_smoke
  checkpoint_dir: ./runs_warmup_smoke/checkpoints
